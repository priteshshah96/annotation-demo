services:
  - type: web
    name: annotation-demo
    env: node
    buildCommand: |
      npm ci
      npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VITE_MONGODB_URI
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLIENT_URL
        value: https://annotation-demo.onrender.com
    staticPublishPath: ./dist
    autoDeploy: true
