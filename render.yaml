services:
  - type: web
    name: annotation-demo
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_MONGODB_URI
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLIENT_URL
        value: https://annotation-demo.onrender.com